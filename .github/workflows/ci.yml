name: NEXUS CI

on:
  push:
    branches:
      - master
      - phase-293b-final
  pull_request:
    branches:
      - master
      - phase-293-log-sanitization

jobs:
  build-test-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Phase 285/291/292B/293 regression tests
        env:
          NEXUS_ENVELOPE_HMAC_PROVIDER: env
          NEXUS_ENVELOPE_HMAC_KID: ci-test-k1
          NEXUS_ENVELOPE_HMAC_KEY_HEX: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          set -euo pipefail
          tests=(
            scripts/test-phase292b-key-provider.ts
            scripts/test-phase292b-gateway-quarantine.ts
            scripts/test-phase292b-inspection.ts
            scripts/test-phase292b-replay.ts
            scripts/test-phase292b-aws-provider.ts
            scripts/test-phase292b-aws-cli.ts
            scripts/test-phase292-envelope-persistence.ts
            scripts/test-phase293-log-sanitization.ts
            scripts/test-phase293-provider-gate.ts
            scripts/test-phase293-rotation.ts
            scripts/test-phase293-failure-modes.ts
            scripts/test-phase285-audit-and-gateway-error-redaction.ts
            scripts/test-phase285-runtime-redaction-callsite-audit.ts
            scripts/test-phase291-worker-gateway-recovery-acceptance.ts
          )
          for test in "${tests[@]}"; do
            echo "=== $test ==="
            npx tsx "$test"
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Run core tests
        run: npm run test:core

      - name: Build
        run: npm run build

      - name: Install security tools
        run: |
          pip install semgrep checkov
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks

      - name: Security scan
        run: npx tsx scripts/run-security-scan.ts

  container-scan:
    runs-on: ubuntu-latest
    needs: build-test-security
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build Docker image
        run: docker build -t nexus/nexus-app:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nexus/nexus-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
