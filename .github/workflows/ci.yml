name: NEXUS CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-test-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run core tests
        run: npm run test:core

      - name: Build
        run: npm run build

      - name: Install security tools
        run: |
          pip install semgrep checkov gitleaks

      - name: Security scan
        run: npx tsx scripts/run-security-scan.ts